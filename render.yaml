services:
  - type: web
    name: op3nsrc-api
    runtime: python
    plan: free
    branch: hosting
    buildCommand: pip install -r server/requirements.txt && mkdir -p ml/data && tar -xzf deploy-data.tar.gz -C ml/data
    startCommand: uvicorn app.main:app --app-dir server --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: OP3NSRC_LOW_MEMORY
        value: "true"
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: op3nsrc-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    runtime: static
    name: op3nsrc-web
    branch: hosting
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: op3nsrc-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
